<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance | sivnsh7.in</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            /* Light theme – soft, warm, premium */
            --bg: #F9F8F6;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(0, 0, 0, 0.04);
            --text-primary: #1E1E1E;
            --text-secondary: #6B6B6B;
            --accent: #9B8E7E;
            --accent-soft: rgba(155, 142, 126, 0.12);
            --icon-bg: rgba(0, 0, 0, 0.03);
            --icon-border: rgba(0, 0, 0, 0.06);
            --toggle-bg: rgba(0, 0, 0, 0.05);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.03);
            --gear-stroke: #9B8E7E;
        }

        [data-theme="dark"] {
            --bg: #1A1A1A;
            --card-bg: rgba(36, 36, 36, 0.7);
            --card-border: rgba(255, 255, 255, 0.04);
            --text-primary: #E5E5E5;
            --text-secondary: #8A8A8A;
            --accent: #C9B99A;
            --accent-soft: rgba(201, 185, 154, 0.1);
            --icon-bg: rgba(255, 255, 255, 0.04);
            --icon-border: rgba(255, 255, 255, 0.06);
            --toggle-bg: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            --gear-stroke: #C9B99A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.5s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle grid texture – very faint */
        .bg-texture {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.02;
            background-image: 
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        [data-theme="dark"] .bg-texture {
            opacity: 0.03;
            background-image: 
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        /* Theme toggle – minimal icon button */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--toggle-bg);
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1rem;
            transition: all 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .theme-toggle:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        /* Gear icon – delicate outline */
        .gear-wrapper {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
        }
        .gear-wrapper svg {
            width: 100%;
            height: 100%;
            stroke: var(--gear-stroke);
            fill: none;
            stroke-width: 1.5;
            animation: slowRotate 25s linear infinite;
        }
        @keyframes slowRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Card – barely there glass effect */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px 32px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-text {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 18px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            line-height: 1.25;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .description {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 280px;
            margin: 0 auto 24px;
            opacity: 0.85;
        }

        /* Social links – minimal, no backgrounds */
        .social-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .social-link {
            color: var(--text-secondary);
            font-size: 1rem;
            transition: color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .social-link:hover {
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.7;
            letter-spacing: 0.3px;
        }
        .footer span {
            font-weight: 500;
            color: var(--accent);
        }
        .divider {
            width: 20px;
            height: 1px;
            background: var(--accent);
            margin: 12px auto;
            opacity: 0.4;
        }

        @media (max-width: 460px) {
            .card {
                padding: 32px 20px;
                border-radius: 16px;
            }
            h1 {
                font-size: 1.4rem;
            }
            .container {
                gap: 24px;
            }
            .gear-wrapper {
                width: 44px;
                height: 44px;
            }
            .theme-toggle {
                top: 18px;
                right: 18px;
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body data-theme="light">

    <!-- Subtle texture overlay -->
    <div class="bg-texture"></div>

    <!-- Theme toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>

    <!-- Main content -->
    <div class="container">
        <!-- Minimal gear icon -->
        <div class="gear-wrapper">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" fill="none"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" fill="none"/>
            </svg>
        </div>

        <!-- Card with casual + tech‑aware copy -->
        <div class="card">
            <div class="status-text">Refactoring pixels, brb</div>
            <h1>Tweaking dependencies & polishing the UI.</h1>
            <p class="description">
                Running a fresh build, optimizing some assets, and squashing a couple of bugs. The portfolio's getting a clean deploy — catch you in a bit.
            </p>

            <!-- Social links (unchanged) -->
            <div class="social-links">
                <a href="https://github.com/sivnsh7" target="_blank" rel="noopener" class="social-link" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="https://instagram.com/sivnsh7.in" target="_blank" rel="noopener" class="social-link" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://twitter.com/sivnsh7" target="_blank" rel="noopener" class="social-link" aria-label="Twitter">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <a href="mailto:sivnsh7@gmail.com" class="social-link" aria-label="Email">
                    <i class="fa-solid fa-envelope"></i>
                </a>
            </div>

            <div class="divider"></div>
            <p class="footer">
                &copy; <span id="currentYear"></span> All Rights Reserved — <span>sivnsh7.in</span>
            </p>
        </div>
    </div>

    <script>
        (function() {
            const html = document.documentElement;
            const toggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const yearSpan = document.getElementById('currentYear');
            
            yearSpan.textContent = new Date().getFullYear();

            // Theme preference
            const saved = localStorage.getItem('sivnsh7-theme-min') || 'light';
            setTheme(saved);

            toggleBtn.addEventListener('click', () => {
                const current = html.getAttribute('data-theme');
                const next = current === 'light' ? 'dark' : 'light';
                setTheme(next);
                localStorage.setItem('sivnsh7-theme-min', next);
                // tiny feedback
                toggleBtn.style.transform = 'scale(0.9)';
                setTimeout(() => { toggleBtn.style.transform = ''; }, 150);
            });

            function setTheme(theme) {
                html.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    themeIcon.className = 'fa-solid fa-sun';
                } else {
                    themeIcon.className = 'fa-solid fa-moon';
                }
            }

            console.log('%c sivnsh7.in %c• under maintenance',
                'color: #9B8E7E; font-weight: 600;', 'color: #6B6B6B;');
        })();
    </script>
</body>
</html>
